# phone-wm Launcher Config
# Format: name=command=r,g,b|icon=/pfad/zu/icon.png|home
#
# Felder:
#   name    - App-Name (wird als Fallback-Icon-Buchstabe angezeigt)
#   command - Shell-Befehl zum Starten
#   r,g,b   - Fallback-Farbe (0.0-1.0) falls kein Icon gefunden wird
#   icon    - Optional: Absoluter Pfad zum PNG-Icon
#             ODER Icon-Name (z.B. "utilities-terminal") fuer XDG-Suche
#   home    - Optional: Auf Home-Screen anzeigen
#
# Icon-Suche Reihenfolge:
#   1. Absoluter Pfad wenn angegeben (icon=/pfad/zu/icon.png)
#   2. XDG Icon-Theme: /usr/share/icons/{hicolor,Papirus,...}/{sizes}/apps/{name}.png
#   3. Lokal: ~/.local/share/icons/{theme}/{sizes}/apps/{name}.png
#
# Kopiere deine Icons nach ~/.local/share/icons/phone-wm/scalable/apps/
# oder benutze absolute Pfade in dieser Datei.

# Format: name=command=r,g,b|icon=Pfad|home

Terminal=kitty=0.1,0.1,0.1|icon=/home/imgsh/phone/wm-vulkan/icons/terminal.png|home
Browser=firefox=0.0,0.4,0.8|icon=/home/imgsh/phone/wm-vulkan/icons/browser.png|home
Files=thunar=0.2,0.6,0.2|icon=/home/imgsh/phone/wm-vulkan/icons/files.png|home
Calculator=gnome-calculator=0.8,0.4,0.0|icon=/home/imgsh/phone/wm-vulkan/icons/calculator.png|home
Settings=gnome-control-center=0.6,0.6,0.6|icon=/home/imgsh/phone/wm-vulkan/icons/settings.png
Calendar=gnome-calendar=0.6,0.2,0.6|icon=/home/imgsh/phone/wm-vulkan/icons/calendar.png
Music=spotify=0.1,0.8,0.2|icon=/home/imgsh/phone/wm-vulkan/icons/music.png
Maps=gnome-maps=0.0,0.6,0.4|icon=/home/imgsh/phone/wm-vulkan/icons/maps.png
